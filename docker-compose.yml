version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: contractiq_postgres
    environment:
      POSTGRES_DB: contractiq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contractiq_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/contractiq
      JWT_SECRET: super_secret_jwt_key_change_in_production_contractiq_2026
      AI_PROVIDER: mock
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/uploaded_contracts:/app/uploaded_contracts

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: contractiq_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
